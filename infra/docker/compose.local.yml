services:
  postgres:
    image: docker.io/postgis/postgis:17-3.5
    container_name: turismo-vinculacion-postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
      TZ: America/Guayaquil
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - turismo_vinculacion_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  turismo_vinculacion_postgres_data:
